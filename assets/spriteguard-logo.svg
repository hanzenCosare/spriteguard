<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SpriteGuard Logo">
  <defs>
    <linearGradient id="sg-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11182c"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>
    <linearGradient id="sg-accent" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d7cff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sg-shield-fill" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2948" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sg-bg)" stroke="url(#sg-accent)" stroke-width="2" stroke-opacity="0.65"/>

  <!-- Outer zero-trust shield -->
  <path d="M32 10L50 17.5V31.5C50 43.2 42.3 51.3 32 55C21.7 51.3 14 43.2 14 31.5V17.5L32 10Z" fill="url(#sg-shield-fill)" stroke="url(#sg-accent)" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- MicroVM circuit traces -->
  <path d="M32 18V24M32 40V46M20 32H24M40 32H44" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M23.5 23.5L26.5 26.5M40.5 23.5L37.5 26.5M23.5 40.5L26.5 37.5M40.5 40.5L37.5 37.5" stroke="#6d7cff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Isolated microVM core -->
  <rect x="24" y="24" width="16" height="16" rx="3.5" fill="#090e1c" stroke="url(#sg-accent)" stroke-width="2"/>

  <!-- Verified checkmark / active core -->
  <path d="M28.2 32.3L30.9 35L36.2 29.3" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circuit endpoint nodes -->
  <circle cx="32" cy="17.5" r="1.8" fill="#22d3ee"/>
  <circle cx="32" cy="46.5" r="1.8" fill="#6d7cff"/>
  <circle cx="19.5" cy="32" r="1.8" fill="#22d3ee"/>
  <circle cx="44.5" cy="32" r="1.8" fill="#6d7cff"/>
</svg>
